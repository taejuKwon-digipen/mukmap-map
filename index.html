<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>mukmap 지도</title>
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ee77f660f6d2b59e63db284a6a8622fd&autoload=false"></script>
<script>
  var map;
  var markers = [];
  var userMarker = null;
  var pendingRestaurants = null;
  var RESTAURANT_MARKER_IMG;
  var USER_MARKER_IMG;
  var infoWindow;

  function notifyReady() {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ready' }));
    }
  }

  kakao.maps.load(function () {
    RESTAURANT_MARKER_IMG = new kakao.maps.MarkerImage(
      'data:image/svg+xml;base64,' +
        btoa('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><circle cx="8" cy="8" r="6" fill="#FF8FAB" stroke="#ffffff" stroke-width="2"/></svg>'),
      new kakao.maps.Size(16, 16),
      { offset: new kakao.maps.Point(8, 8) }
    );

    USER_MARKER_IMG = new kakao.maps.MarkerImage(
      'data:image/svg+xml;base64,' +
        btoa('<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="9" fill="#5C374C" stroke="#ffffff" stroke-width="3"/></svg>'),
      new kakao.maps.Size(22, 22),
      { offset: new kakao.maps.Point(11, 11) }
    );

    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(35.8714, 128.6014),
      level: 5,
    });
    infoWindow = new kakao.maps.InfoWindow({ removable: true });
    notifyReady();
    if (pendingRestaurants) {
      window.renderRestaurants(pendingRestaurants);
      pendingRestaurants = null;
    }
  });

  function clearMarkers() {
    markers.forEach(function (m) { m.setMap(null); });
    markers = [];
    if (infoWindow) infoWindow.close();
  }

  window.renderRestaurants = function (list) {
    if (!map) {
      pendingRestaurants = list;
      return;
    }
    clearMarkers();
    list.forEach(function (r) {
      var pos = new kakao.maps.LatLng(r.lat, r.lng);
      var marker = new kakao.maps.Marker({ position: pos, map: map, image: RESTAURANT_MARKER_IMG, title: r.name });
      var content =
        '<div style="padding:6px 10px;font-size:13px;white-space:nowrap;">' +
        r.name +
        '<br/><small>' +
        r.signatureMenu +
        '</small></div>';
      kakao.maps.event.addListener(marker, 'click', function () {
        infoWindow.setContent(content);
        infoWindow.open(map, marker);
      });
      markers.push(marker);
    });
  };

  window.setCenter = function (lat, lng) {
    if (!map) return;
    var pos = new kakao.maps.LatLng(lat, lng);
    map.setLevel(5);
    map.setCenter(pos);
    if (userMarker) userMarker.setMap(null);
    userMarker = new kakao.maps.Marker({ position: pos, map: map, image: USER_MARKER_IMG, title: '내 위치' });
  };
</script>
</body>
</html>
